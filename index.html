<script id="position-undo-manager">
globalThis.LPPositionHistory=(()=>{const undo=[],redo=[];return {push(action){undo.push(action);if(undo.length>50)undo.shift();redo.length=0;},undo(){const action=undo.pop();if(!action)return false;action.undo();redo.push(action);return true;},redo(){const action=redo.pop();if(!action)return false;action.redo();undo.push(action);return true;}};})();
document.addEventListener('keydown',event=>{if(!(event.ctrlKey||event.metaKey)||event.altKey||event.key.toLowerCase()!=='z'||event.target.closest('input,textarea,[contenteditable=true],dialog'))return;const done=event.shiftKey?LPPositionHistory.redo():LPPositionHistory.undo();if(done)event.preventDefault();else{const button=document.querySelector(event.shiftKey?'.hy-redo-lines':'.hy-undo-lines');if(button&&!button.disabled){event.preventDefault();button.click();}}});
</script>

<body>
<style>
#lp-hybrid{--paper:light-dark(#fff,#202734);--canvas:light-dark(#f3f6fa,#161b24);--ink:light-dark(#243043,#e7edf7);--quiet:light-dark(#69768a,#aebbd0);--edge:light-dark(#dfe6ef,#38465c);--blue:light-dark(#285bc0,#91b4ff);--soft:light-dark(#eaf0fc,#293b5c);font:14px/1.5 system-ui;color:var(--ink);background:var(--canvas);border:1px solid var(--edge);border-radius:14px;overflow:clip;--space:12px}
#lp-hybrid *{box-sizing:border-box}#lp-hybrid .hy-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;padding-right:105px;background:var(--paper);border-bottom:1px solid var(--edge)}#lp-hybrid .hy-head strong{font-size:18px;font-weight:600}#lp-hybrid .hy-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 12px;background:var(--paper);color:var(--ink);border:1px solid var(--edge);border-radius:8px;font:inherit}#lp-hybrid .hy-button:hover{background:var(--soft)}#lp-hybrid .hy-button svg{width:17px;height:17px}#lp-hybrid .hy-button[aria-pressed=true]{color:var(--blue);background:var(--soft);border-color:var(--blue)}#lp-hybrid .hy-switch{width:28px;height:16px;border-radius:12px;background:var(--quiet);padding:3px}#lp-hybrid .hy-switch::after{content:'';display:block;width:10px;height:10px;border-radius:50%;background:var(--paper);transition:transform .22s}#lp-hybrid .hy-focus[aria-pressed=true] .hy-switch{background:var(--blue)}#lp-hybrid .hy-focus[aria-pressed=true] .hy-switch::after{transform:translateX(12px)}

#lp-hybrid .hy-work{padding:22px;min-width:0;display:flex;flex-direction:column;gap:18px}#lp-hybrid .hy-symbols{display:flex;flex-wrap:wrap;gap:7px}#lp-hybrid .hy-symbol{padding:7px;min-width:38px;font:21px/1.1 'Cambria Math',serif}#lp-hybrid .hy-common{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:15px;border-bottom:1px solid var(--edge)}#lp-hybrid .hy-caption{font-size:12px;color:var(--quiet);margin:0 0 8px}#lp-hybrid .hy-current{background:var(--paper);border:1px solid var(--edge);border-radius:10px;padding:14px}#lp-hybrid .hy-current[hidden]{display:none}#lp-hybrid .hy-panel{background:var(--paper);border:1px solid var(--edge);border-radius:12px;padding:20px;min-width:0}#lp-hybrid .hy-panel h3{font-size:14px;font-weight:500;margin:0 0 18px}#lp-hybrid .hy-rows{display:grid;gap:var(--space)}#lp-hybrid .hy-row{display:grid;grid-template-columns:22px minmax(0,1fr) 100px;gap:8px;align-items:center}#lp-hybrid .hy-grip{display:flex;color:var(--quiet);cursor:grab;touch-action:none}#lp-hybrid .hy-grip svg{width:18px;height:18px}#lp-hybrid .hy-row input{width:100%;min-width:0;padding:11px 12px;color:var(--ink);background:var(--paper);border:1px solid var(--edge);border-radius:8px;font:18px/1.4 'Cambria Math',system-ui}#lp-hybrid .hy-row input:focus{outline:2px solid var(--blue);outline-offset:1px}#lp-hybrid .hy-role{font-size:12px;padding:8px 6px}#lp-hybrid .hy-role[aria-pressed=true]{background:var(--soft);color:var(--blue)}#lp-hybrid .hy-add{margin-top:18px;border-style:dashed;color:var(--blue)}#lp-hybrid .hy-editor{min-height:254px}#lp-hybrid .hy-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#lp-hybrid .hy-tools .hy-export{margin-left:auto;background:var(--blue);color:light-dark(#fff,#15243d);border-color:var(--blue)}
#lp-hybrid .hy-preview-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease,opacity .25s ease;opacity:1}#lp-hybrid .hy-preview-wrap[data-open=false]{grid-template-rows:0fr;opacity:0;pointer-events:none}#lp-hybrid .hy-preview-inner{overflow:hidden;min-height:0}#lp-hybrid .hy-preview{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:20px/1.85 'Cambria Math',serif;min-height:92px}#lp-hybrid .hy-status{font-size:12px;color:var(--quiet);min-height:0}#lp-hybrid .hy-status:empty{display:none}#lp-hybrid .hy-row.dragging{opacity:.4}#lp-hybrid .hy-row.drag-target{outline:2px solid var(--blue);outline-offset:4px;border-radius:8px}

updateDrag=function(){if(!drag||drag.members?.length<2)return originalUpdate();const members=drag.members,others=rows.filter(r=>!members.includes(r));const direction=drag.y-drag.startY;let index=0;for(const r of others){const element=rowElements.get(r),box=element.getBoundingClientRect();if(drag.y>box.top+box.height*(direction>=0?.65:.35))index++;}const next=[...others.slice(0,index),...members,...others.slice(index)];if(next.some((r,i)=>r!==rows[i])){rows=next;animateOrder();render();}for(const r of members)if(r!==drag.row)rowElements.get(r)?.classList.add('hy-group-moving');if(drag.ghost){drag.ghost.style.transform='translate('+(drag.x-drag.offsetX-10)+'px,'+(drag.y-drag.offsetY-8)+'px)';drag.ghost.dataset.groupCount=members.length;}};
finishDrag=function(event,cancel=false){if(!drag||drag.pointerId!==event.pointerId)return;const state=drag;if(state.ghost){suppressClickUntil=Date.now()+350;if(!cancel&&rows.some((r,i)=>r!==state.original[i])){redoHistory().length=0;history().push(state.undoSnapshot);if(history().length>30)history().shift();}}const changed=!cancel&&state.ghost&&rows.some((r,i)=>r!==state.original[i]),before=state.undoSnapshot,after=rows.map(r=>({...r})),id=argumentWorkspace.activeId;originalFinish(event,cancel);updateControls();if(changed){const restore=snapshot=>{if(argumentWorkspace.activeId!==id)showArgument(id);rows=snapshot.map(r=>({...r}));selected.clear();drawRows();render();updateControls();};LPPositionHistory.push({undo:()=>{if(argumentWorkspace.activeId!==id)showArgument(id);if(history().at(-1)===before)history().pop();redoHistory().push(after);restore(before);},redo:()=>{if(argumentWorkspace.activeId!==id)showArgument(id);if(redoHistory().at(-1)===after)redoHistory().pop();history().push(before);restore(after);}});rowsContainer.tabIndex=-1;rowsContainer.focus({preventScroll:true});}};
select.onclick=()=>{selectionMode=!selectionMode;if(!selectionMode)selected.clear();updateControls();};bulk.onclick=()=>deleteRows(rows.filter(r=>selected.has(r)));undo.onclick=()=>{const snapshot=history().pop();if(!snapshot)return;redoHistory().push(rows.map(r=>({...r})));selected.clear();rows=snapshot.map(r=>({...r}));drawRows();render();updateControls();};redo.onclick=()=>{const snapshot=redoHistory().pop();if(!snapshot)return;history().push(rows.map(r=>({...r})));selected.clear();rows=snapshot.map(r=>({...r}));drawRows();render();updateControls();};
let lastEdit=null,lastEditTime=0;rowsContainer.addEventListener('beforeinput',event=>{if(!event.target.matches('.hy-block'))return;const now=Date.now();if(lastEdit!==event.target||now-lastEditTime>700)remember();lastEdit=event.target;lastEditTime=now;});rowsContainer.addEventListener('input',()=>{redoHistory().length=0;updateControls();});
const originalDraw=drawRows;drawRows=function(index){originalDraw(index);updateControls();};drawRows();updateControls();
document.addEventListener('pointerdown',event=>{if(event.target.closest('.hy-row,.hy-line-controls'))return;if(selected.size){selected.clear();updateControls();}});
})();

</script>

<script>
(()=>{
const editor=root.querySelector('.hy-editor'),argumentPanel=root.querySelector('.hy-argument-panel'),logic=root.querySelector('.hy-logic-area');
const board=document.createElement('div');board.className='hy-panel-board';editor.before(board);
const frames=[editor,argumentPanel].map((panel,index)=>{const frame=document.createElement('div');frame.className='hy-panel-frame';frame.dataset.panel=String(index);board.append(frame);frame.append(panel);if(index&&logic)frame.append(logic);return frame;});
let manual=false,gesture=null,pending=null,saveTimer=null,anchors=null,separation=[];
function captureSeparation(){separation=[];frames.forEach((upper,i)=>frames.forEach((lower,j)=>{if(i===j)return;const bottom=number(upper.style.top)+upper.offsetHeight,gap=number(lower.style.top)-bottom;if(gap>=-1)separation.push({upper:i,lower:j,gap:Math.max(0,gap)});}));}
function keepSeparated(){for(const relation of separation){const upper=frames[relation.upper],lower=frames[relation.lower],left=number(upper.style.left),otherLeft=number(lower.style.left);if(left<otherLeft+lower.offsetWidth&&otherLeft<left+upper.offsetWidth){const minimum=number(upper.style.top)+upper.offsetHeight+relation.gap;if(number(lower.style.top)<minimum)lower.style.top=minimum+'px';}}}
function captureAnchors(){const width=board.clientWidth;if(width<=0)return;anchors=frames.map(frame=>({widthRatio:frame.offsetWidth/width,position:width>frame.offsetWidth?number(frame.style.left)/(width-frame.offsetWidth):.5}));}
function applyAnchors(){if(!anchors||board.clientWidth<=0)return;const available=board.clientWidth;frames.forEach((frame,i)=>{const anchor=anchors[i],width=Math.min(available,Math.max(Math.min(280,available),anchor.widthRatio*available));frame.style.width=width+'px';frame.style.left=(available-width)*Math.max(0,Math.min(1,anchor.position))+'px';});}
const storageKey='formal-panel-layout-v1',number=value=>Number.parseFloat(value)||0;
function fit(){const available=board.clientWidth;for(const frame of frames){if(number(frame.style.width)>available)frame.style.width=available+'px';if(manual)frame.style.left=Math.max(0,Math.min(number(frame.style.left),available-frame.offsetWidth))+'px';}if(manual)board.style.minHeight=Math.max(360,...frames.map(frame=>number(frame.style.top)+frame.offsetHeight+28))+'px';}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(storageKey,JSON.stringify({manual,anchors,separation,frames:frames.map(frame=>({x:number(frame.style.left),y:number(frame.style.top),width:frame.style.width,height:frame.style.height}))}));}catch{}},160);}
function freeLayout(){if(manual)return;const bounds=board.getBoundingClientRect(),positions=frames.map(frame=>frame.getBoundingClientRect());board.style.minHeight=board.offsetHeight+'px';manual=true;board.dataset.manual='true';frames.forEach((frame,index)=>{frame.style.left=(positions[index].left-bounds.left)+'px';frame.style.top=(positions[index].top-bounds.top)+'px';frame.style.width=positions[index].width+'px';});captureAnchors();captureSeparation();}
function layoutSnapshot(){return {manual,anchors:anchors?anchors.map(a=>({...a})):null,frames:frames.map(f=>({left:f.style.left,top:f.style.top,width:f.style.width}))};}
function restoreLayout(snapshot){manual=snapshot.manual;anchors=snapshot.anchors?snapshot.anchors.map(a=>({...a})):null;board.dataset.manual=String(manual);frames.forEach((f,i)=>Object.assign(f.style,snapshot.frames[i]));if(manual)applyAnchors();else board.style.minHeight='';fit();captureSeparation();save();}
function recordLayout(before){const after=layoutSnapshot();if(JSON.stringify(before)!==JSON.stringify(after))LPPositionHistory.push({undo:()=>restoreLayout(before),redo:()=>restoreLayout(after)});}
function cancelPending(){if(pending)clearTimeout(pending.timer);pending=null;}
function start(event,frame,edge=''){const before=layoutSnapshot();freeLayout();gesture={before,frame,edge,pointerId:event.pointerId,x:event.clientX,y:event.clientY,left:number(frame.style.left),top:number(frame.style.top),width:frame.offsetWidth,height:frame.offsetHeight};frame.setPointerCapture(event.pointerId);frame.classList.add('hy-panel-moving');if(!edge)board.classList.add('hy-show-center');}
function move(event){if(pending&&event.pointerId===pending.pointerId&&Math.hypot(event.clientX-pending.x,event.clientY-pending.y)>6)cancelPending();if(!gesture||gesture.pointerId!==event.pointerId)return;event.preventDefault();const state=gesture,frame=state.frame,dx=event.clientX-state.x,dy=event.clientY-state.y;let left=state.left,top=state.top,width=state.width,height=state.height;
 if(!state.edge){const center=(board.clientWidth-frame.offsetWidth)/2;left=Math.max(0,Math.min(left+dx,board.clientWidth-frame.offsetWidth));if(Math.abs(left-center)<24)left=center;top=Math.max(0,top+dy);}
 else{const minWidth=Math.min(280,board.clientWidth);if(state.edge==='e')width=Math.max(minWidth,Math.min(state.width+dx,board.clientWidth-left));if(state.edge==='w'){left=Math.max(0,Math.min(state.left+dx,state.left+state.width-minWidth));width=state.left+state.width-left;}frame.style.width=width+'px';}
 frame.style.left=left+'px';frame.style.top=top+'px';fit();}
function finish(event){cancelPending();if(!gesture||gesture.pointerId!==event.pointerId)return;const state=gesture;gesture=null;if(state.frame.hasPointerCapture(state.pointerId))state.frame.releasePointerCapture(state.pointerId);state.frame.classList.remove('hy-panel-moving');board.classList.remove('hy-show-center');fit();captureAnchors();captureSeparation();save();recordLayout(state.before);state.frame.focus({preventScroll:true});}
frames.forEach(frame=>{
 frame.tabIndex=0;frame.setAttribute('role','group');frame.setAttribute('aria-label',frame.dataset.panel==='0'?'Editor panel. Arrow keys move; Shift + arrows resize.':'Argument panel. Arrow keys move; Shift + arrows resize.');frame.addEventListener('keydown',event=>{if(event.target!==frame||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();const before=layoutSnapshot();freeLayout();const step=event.altKey?1:10;if(event.shiftKey){if(event.key==='ArrowLeft'||event.key==='ArrowRight')frame.style.width=Math.max(Math.min(280,board.clientWidth),Math.min(board.clientWidth-number(frame.style.left),frame.offsetWidth+(event.key==='ArrowRight'?step:-step)))+'px';}else{frame.style.left=Math.max(0,Math.min(board.clientWidth-frame.offsetWidth,number(frame.style.left)+(event.key==='ArrowRight'?step:event.key==='ArrowLeft'?-step:0)))+'px';frame.style.top=Math.max(0,number(frame.style.top)+(event.key==='ArrowDown'?step:event.key==='ArrowUp'?-step:0))+'px';}fit();captureAnchors();captureSeparation();save();recordLayout(before);});
 for(const edge of ['e','w']){const handle=document.createElement('div');handle.className='hy-panel-edge hy-edge-'+edge;handle.dataset.resizeEdge=edge;handle.setAttribute('aria-hidden','true');frame.append(handle);}
 frame.addEventListener('pointerdown',event=>{if(event.button!==0)return;const edge=event.target.dataset.resizeEdge;if(edge){event.preventDefault();event.stopPropagation();start(event,frame,edge);return;}
 if(event.target.closest('.hy-row,button,input,label,a,summary,dialog,.hy-logic-panel,pre'))return;
 if(!event.target.matches('.hy-panel-frame,.hy-editor,.hy-argument-panel,.hy-section-head,.hy-collapse,.hy-collapse-inner,.hy-rows,.hy-preview-wrap,.hy-preview-inner,.hy-logic-area,.hy-logic-footer,.hy-tools,.hy-export-group'))return;
 cancelPending();const value={pointerId:event.pointerId,clientX:event.clientX,clientY:event.clientY};pending={pointerId:event.pointerId,x:event.clientX,y:event.clientY,timer:setTimeout(()=>{pending=null;if(frame.isConnected&&!drag)start(value,frame);},50)};
 });frame.addEventListener('pointermove',move);frame.addEventListener('pointerup',finish);frame.addEventListener('pointercancel',finish);frame.addEventListener('lostpointercapture',finish);
});
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved&&typeof saved.manual==='boolean'&&saved.frames?.length===2){manual=saved.manual;if(Array.isArray(saved.anchors)&&saved.anchors.length===2&&saved.anchors.every(a=>a&&Number.isFinite(a.widthRatio)&&a.widthRatio>0&&Number.isFinite(a.position)))anchors=saved.anchors;board.dataset.manual=String(manual);frames.forEach((frame,index)=>{const value=saved.frames[index];if(Number.isFinite(value.x)&&Number.isFinite(value.y)){frame.style.left=Math.max(0,value.x)+'px';frame.style.top=Math.max(0,Math.min(5000,value.y))+'px';}if(/^\d+(\.\d+)?px$/.test(value.width))frame.style.width=value.width;});fit();}}catch{}
if(manual){if(!anchors)captureAnchors();applyAnchors();captureSeparation();}
root.addEventListener('lp-reset-panel-layout',()=>{cancelPending();if(gesture){const state=gesture;gesture=null;if(state.frame.hasPointerCapture(state.pointerId))state.frame.releasePointerCapture(state.pointerId);state.frame.classList.remove('hy-panel-moving');}manual=false;anchors=null;separation=[];board.dataset.manual='false';board.classList.remove('hy-show-center');board.style.minHeight='';frames.forEach(f=>{f.style.width='';f.style.height='';f.style.left='';f.style.top='';});fit();save();});
let ready=false,lastWidth=board.clientWidth,lastGeometry=frames.map(f=>({top:number(f.style.top),height:f.offsetHeight,left:number(f.style.left),width:f.offsetWidth}));
const observer=new ResizeObserver(()=>{
 const width=board.clientWidth;
 if(manual&&ready&&!gesture&&width>0&&Math.abs(width-lastWidth)>.1)applyAnchors();
 if(manual&&ready&&!gesture)keepSeparated();
 fit();lastWidth=width;lastGeometry=frames.map(f=>({top:number(f.style.top),height:f.offsetHeight,left:number(f.style.left),width:f.offsetWidth}));if(ready&&!gesture)save();});frames.forEach(frame=>observer.observe(frame));observer.observe(board);requestAnimationFrame(()=>{ready=true;fit();});
})();

</script>

<script id="export-menu-script">(()=>{
const trigger=document.getElementById('download'),downloadText=trigger.onclick;
const wrapper=document.createElement('div');wrapper.className='hy-export-menu-wrap';trigger.before(wrapper);wrapper.append(trigger);
const menu=document.createElement('div');menu.className='hy-export-menu';menu.hidden=true;menu.id='export-formats';menu.setAttribute('role','group');menu.setAttribute('aria-label','Formato');wrapper.append(menu);
trigger.setAttribute('aria-expanded','false');trigger.setAttribute('aria-controls',menu.id);
function close(){menu.hidden=true;trigger.setAttribute('aria-expanded','false');}
function save(bytes){const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),link=document.createElement('a');link.href=url;link.download='argumento.pdf';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function pdf(){
 await document.fonts.ready;
 const canvas=document.createElement('canvas');canvas.width=1240;canvas.height=1754;
 const ctx=canvas.getContext('2d');ctx.font='32px "Cambria Math",serif';
 const lines=[];
 for(const original of argument().split('\n')){let line='';for(const char of original){if(ctx.measureText(line+char).width>1080&&line){lines.push(line);line='';}line+=char;}lines.push(line);}
 const pages=[];
 for(let offset=0;offset<lines.length;offset+=30){ctx.fillStyle='#fff';ctx.fillRect(0,0,1240,1754);ctx.fillStyle='#20242b';ctx.font='32px "Cambria Math",serif';lines.slice(offset,offset+30).forEach((line,i)=>ctx.fillText(line,80,110+i*50));pages.push(Uint8Array.from(atob(canvas.toDataURL('image/jpeg',.95).split(',')[1]),c=>c.charCodeAt(0)));}
 const encoder=new TextEncoder(),chunks=[],offsets=[0];let size=0;
 const put=data=>{const bytes=typeof data==='string'?encoder.encode(data):data;chunks.push(bytes);size+=bytes.length;};
 const obj=(id,body)=>{offsets[id]=size;put(id+' 0 obj\n');put(body);put('\nendobj\n');};
 put('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');
 pages.forEach((jpeg,i)=>{const id=3+i*3;obj(id,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Image '+(id+1)+' 0 R >> >> /Contents '+(id+2)+' 0 R >>');offsets[id+1]=size;put((id+1)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');put(jpeg);put('\nendstream\nendobj\n');const content='q 595.28 0 0 841.89 0 0 cm /Image Do Q';obj(id+2,'<< /Length '+encoder.encode(content).length+' >>\nstream\n'+content+'\nendstream');});
 const xref=size;put('xref\n0 '+offsets.length+'\n0000000000 65535 f \n');offsets.slice(1).forEach(offset=>put(String(offset).padStart(10,'0')+' 00000 n \n'));put('trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
 const result=new Uint8Array(size);let position=0;for(const chunk of chunks){result.set(chunk,position);position+=chunk.length;}save(result);
}
for(const format of ['.txt','.pdf']){const button=document.createElement('button');button.type='button';button.className='hy-button';button.textContent=format;button.onclick=async()=>{close();trigger.focus();if(format==='.txt')downloadText();else{trigger.disabled=true;try{await pdf();}finally{trigger.disabled=false;}}};menu.append(button);}
trigger.onclick=()=>{menu.hidden=!menu.hidden;trigger.setAttribute('aria-expanded',String(!menu.hidden));};
document.addEventListener('pointerdown',event=>{if(!wrapper.contains(event.target))close();});
wrapper.addEventListener('keydown',event=>{if(event.key==='Escape'){close();trigger.focus();}else if(event.key==='ArrowDown'){event.preventDefault();menu.hidden=false;trigger.setAttribute('aria-expanded','true');menu.querySelector('button').focus();}});
})();
</script>

<script id="workspace-features">(()=>{
const en=()=>document.documentElement.lang==='en',label=(pt,english)=>en()?english:pt;
const tools=document.createElement('div');tools.className='hy-workspace-tools';
const fileMenu=document.createElement('details'),fileSummary=document.createElement('summary');fileMenu.className='hy-file-menu';fileSummary.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>';fileSummary.setAttribute('aria-label',label('Arquivo','File'));fileMenu.append(fileSummary,tools);root.querySelector('.hy-title').append(fileMenu);
tools.addEventListener('click',event=>{if(event.target.closest('button'))fileMenu.open=false;});
document.addEventListener('pointerdown',event=>{if(!fileMenu.contains(event.target))fileMenu.open=false;});
fileMenu.addEventListener('keydown',event=>{if(event.key==='Escape'){fileMenu.open=false;fileSummary.focus();}});
function button(pt,english,action){const b=document.createElement('button');b.type='button';b.className='hy-button';b.dataset.pt=pt;b.dataset.en=english;b.textContent=label(pt,english);b.onclick=action;tools.append(b);return b;}
function message(text){const dialog=document.createElement('dialog');dialog.className='hy-feature-dialog';const p=document.createElement('p'),ok=document.createElement('button');p.textContent=text;ok.className='hy-button';ok.textContent='OK';ok.onclick=()=>dialog.close();dialog.append(p,ok);root.append(dialog);dialog.onclose=()=>dialog.remove();dialog.showModal();}
button('Salvar todos os argumentos','Save all arguments',()=>{saveArguments();const data={format:'lp-workspace',version:1,activeId:argumentWorkspace.activeId,documents:argumentWorkspace.documents.map(d=>({id:d.id,customName:d.customName||'',numbered:d.numbered,descriptions:d.descriptions||{},rows:d.rows}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='argumentos.lp.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
button('Salvar argumento atual','Save current argument',()=>{saveArguments();const doc=argumentWorkspace.documents.find(d=>d.id===argumentWorkspace.activeId);const data={format:'lp-workspace',version:1,activeId:doc.id,documents:[{id:doc.id,customName:doc.customName||'',numbered:doc.numbered,descriptions:doc.descriptions||{},rows:doc.rows}]};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='argumento.lp.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
const file=document.createElement('input');file.type='file';file.accept='.json,application/json';file.hidden=true;tools.append(file);
button('Importar','Import',()=>file.click());
function addDocument(name,items,numbered=true){const id=crypto.randomUUID();argumentWorkspace.documents.push({id,customName:name,name,rows:items,numbered});return id;}
function previewImport(docs){return new Promise(resolve=>{const d=document.createElement('dialog');d.className='hy-feature-dialog hy-import-preview';const heading=document.createElement('h3');heading.textContent=label('Escolha os argumentos para importar','Choose arguments to import');d.append(heading);const selected=[];docs.forEach((doc,index)=>{const card=document.createElement('label'),check=document.createElement('input'),content=document.createElement('div'),title=document.createElement('strong'),preview=document.createElement('p');check.type='checkbox';check.checked=true;title.textContent=doc.name||label('Argumento ','Argument ')+(index+1);preview.textContent=doc.items.slice(0,4).map(r=>(r.role==='conclusion'?'∴ ':'')+r.text).join(' · ');content.append(title,preview);card.append(check,content);d.append(card);selected.push(check);});const footer=document.createElement('div'),cancel=document.createElement('button'),confirm=document.createElement('button');cancel.className=confirm.className='hy-button';cancel.type=confirm.type='button';cancel.textContent=label('Cancelar','Cancel');confirm.textContent=label('Importar selecionados','Import selected');let accepted=false;cancel.onclick=()=>d.close();confirm.onclick=()=>{if(!selected.some(c=>c.checked))return;accepted=true;d.close();};footer.append(cancel,confirm);d.append(footer);root.append(d);d.onclose=()=>{resolve(accepted?docs.filter((_,i)=>selected[i].checked):[]);d.remove();};d.showModal();});}
file.onchange=async()=>{const chosen=file.files[0];file.value='';if(!chosen)return;try{if(chosen.size>5*1024*1024)throw Error();const data=JSON.parse(await chosen.text());if(data.format!=='lp-workspace'||data.version!==1||!Array.isArray(data.documents)||!data.documents.length||data.documents.length>100)throw Error();let total=0;const docs=data.documents.map(d=>{if(!d||typeof d.customName!=='string'||d.customName.length>240||!Array.isArray(d.rows)||d.rows.length>1000)throw Error();const items=d.rows.map(r=>{if(!r||typeof r.text!=='string'||r.text.length>10000||!['premise','conclusion','blank'].includes(r.role))throw Error();total+=r.text.length;if(total>1000000)throw Error();return {text:r.text,role:r.role};});const descriptions=Object.create(null);if(d.descriptions!==undefined){if(!d.descriptions||typeof d.descriptions!=='object'||Array.isArray(d.descriptions)||Object.keys(d.descriptions).length>1000)throw Error();for(const [name,value] of Object.entries(d.descriptions)){if(name.length>240||typeof value!=='string'||value.length>1000)throw Error();descriptions[name]=value;}}return {name:d.customName,items:items.length?items:[{text:'',role:'premise'}],numbered:d.numbered!==false,oldId:d.id,descriptions};});const chosenDocs=await previewImport(docs);if(!chosenDocs.length)return;saveArguments();let selected;for(const doc of chosenDocs){const id=addDocument(doc.name,doc.items,doc.numbered);argumentWorkspace.documents.find(d=>d.id===id).descriptions=doc.descriptions;if(!selected||doc.oldId===data.activeId)selected=id;}showArgument(selected);saveArguments();}catch{message(label('Arquivo inválido ou acima dos limites de importação. Seus argumentos foram preservados.','Invalid file or import limits exceeded. Your arguments were preserved.'));}};
const examples=[['Modus ponens',[['A → B','premise'],['A','premise'],['B','conclusion']]],['Modus tollens',[['A → B','premise'],['¬ B','premise'],['¬ A','conclusion']]],['Silogismo disjuntivo',[['A ∨ B','premise'],['¬ A','premise'],['B','conclusion']]],['Afirmação do consequente',[['A → B','premise'],['B','premise'],['A','conclusion']]],['Nomes de proposições',[['Chove → RuaMolhada','premise'],['Chove','premise'],['RuaMolhada','conclusion']]]];
function openExamples(){const dialog=document.createElement('dialog');dialog.className='hy-feature-dialog hy-examples-dialog';const heading=document.createElement('h3');heading.textContent=label('Carregar em um novo argumento','Load as a new argument');dialog.append(heading);for(const [name,items] of examples){const b=document.createElement('button');b.className='hy-button';const title=document.createElement('strong'),preview=document.createElement('span');title.textContent=name;preview.textContent=items.map(([text,role])=>(role==='conclusion'?'∴ ':'')+text).join('   ·   ');b.append(title,preview);b.onclick=()=>{saveArguments();const id=addDocument(name,items.map(([text,role])=>({text,role})));showArgument(id);saveArguments();dialog.close();};dialog.append(b);}const close=document.createElement('button');close.className='hy-button';close.textContent=label('Fechar','Close');close.onclick=()=>dialog.close();dialog.append(close);root.append(dialog);dialog.onclose=()=>dialog.remove();dialog.showModal();}

const newButton=root.querySelector('#new-argument'),createBlank=newButton.onclick;
const addWrap=document.createElement('div');addWrap.className='hy-add-argument-wrap';newButton.before(addWrap);addWrap.append(newButton);
const addMenu=document.createElement('div');addMenu.className='hy-new-argument-menu';addMenu.hidden=true;addMenu.id='new-argument-options';addWrap.append(addMenu);newButton.setAttribute('aria-controls',addMenu.id);newButton.setAttribute('aria-expanded','false');
function closeAdd(){addMenu.hidden=true;newButton.setAttribute('aria-expanded','false');}
for(const [pt,english,action] of [['Em branco','Blank',()=>createBlank()],['Exemplo','Example',openExamples]]){const b=document.createElement('button');b.type='button';b.className='hy-button';b.dataset.pt=pt;b.dataset.en=english;b.textContent=label(pt,english);b.onclick=()=>{closeAdd();action();};addMenu.append(b);}
newButton.onclick=()=>{addMenu.hidden=!addMenu.hidden;newButton.setAttribute('aria-expanded',String(!addMenu.hidden));};

function descriptions(){const doc=currentDocument();return doc.descriptions&&typeof doc.descriptions==='object'?doc.descriptions:Object.create(null);}
const bar=el('div',undefined,'hy-advanced-tools');root.querySelector('.hy-logic-footer').append(bar);
bar.append(action(text('Proposições','Propositions'),()=>{const d=dialog(text('Descrição das proposições','Proposition descriptions')),form=el('form'),names=new Set();for(const row of rows){if(!row.text.trim()||row.role==='blank')continue;try{LPLogic.parse(row.text).atoms.forEach(a=>names.add(a));}catch{}}const existing=descriptions();Object.keys(existing).forEach(a=>names.add(a));if(!names.size)d.append(el('p',text('Digite proposições no argumento primeiro.','Enter propositions in the argument first.')));const inputs=[];for(const atom of [...names].sort()){const label=el('label',atom),input=el('input');input.value=typeof existing[atom]==='string'?existing[atom]:'';input.maxLength=1000;input.placeholder=text('Ex.: Está chovendo','E.g. It is raining');label.append(input);form.append(label);inputs.push([atom,input]);}const cancel=action(text('Cancelar','Cancel'),()=>d.close()),save=el('button',text('Salvar','Save'),'hy-button');save.type='submit';form.append(cancel,save);form.onsubmit=e=>{e.preventDefault();const values=Object.create(null);inputs.forEach(([atom,input])=>{if(input.value.trim())values[atom]=input.value.trim();});currentDocument().descriptions=values;
saveArguments();refreshDescriptions();d.close();};d.append(form);d.showModal();}));
function refreshDescriptions(){const values=descriptions();root.querySelectorAll('.hy-block').forEach(input=>{const description=Object.hasOwn(values,input.value)?values[input.value]:null;if(description)input.title=input.value+' — '+description;else input.title=text('Espaço: próximo bloco','Space: next block');});}
new MutationObserver(refreshDescriptions).observe(root.querySelector('#rows'),{childList:true,subtree:true});root.querySelector('#rows').addEventListener('input',refreshDescriptions);
bar.append(action(text('Comparar fórmulas','Compare formulas'),()=>{const d=dialog(text('Equivalência entre fórmulas','Formula equivalence')),form=el('form'),a=el('input'),b=el('input'),result=el('div');result.setAttribute('role','status');for(const [name,input] of [[text('Primeira fórmula','First formula'),a],[text('Segunda fórmula','Second formula'),b]]){const label=el('label',name);input.required=true;label.append(input);form.append(label);}const compare=el('button',text('Comparar','Compare'),'hy-button');compare.type='submit';form.append(compare,action(text('Fechar','Close'),()=>d.close()));let revision=0;form.onsubmit=async e=>{e.preventDefault();const run=++revision;compare.disabled=true;result.textContent=text('Verificando…','Checking…');try{const data=await LPLogic.validate([{text:'('+a.value+') ↔ ('+b.value+')',role:'conclusion'}],{cancelled:()=>run!==revision||!d.open,yieldTask:()=>new Promise(r=>setTimeout(r,0))});if(run!==revision||!d.open)return;if(data.status==='valid')result.textContent=text('As fórmulas são equivalentes em todas as interpretações.','The formulas are equivalent in every interpretation.');else if(data.status==='invalid'){const values=data.conclusions[0].counterexample;result.textContent=text('As fórmulas diferem nesta interpretação: ','The formulas differ in this interpretation: ')+data.atoms.map(atom=>atom+' = '+(values[atom]?text('V','T'):'F')).join(', ');}else result.textContent=text('Confira a sintaxe das fórmulas e o limite de 16 proposições.','Check formula syntax and the 16-proposition limit.');}finally{compare.disabled=false;}};d.append(form,result);d.showModal();}));
const originalValidation=updateLogicValidation;
updateLogicValidation=async function(){const pending=originalValidation(),revision=logicRevision;await pending;if(revision!==logicRevision||!logicEnabled||!['valid','invalid'].includes(logicPanel.dataset.state))return;const snapshot=rows.map(r=>({...r})),prepared=LPLogic.prepare(snapshot);if(prepared.status!=='ready')return;const invalid=[...logicPanel.querySelectorAll('.hy-logic-result[data-valid=false]')];const evaluated=await LPLogic.validate(snapshot,{cancelled:()=>revision!==logicRevision||!logicEnabled,yieldTask:()=>new Promise(r=>setTimeout(r,0))});if(revision!==logicRevision||evaluated.status==='cancelled')return;let index=0;for(const conclusion of evaluated.conclusions||[]){if(!conclusion.counterexample)continue;const section=invalid[index++];if(!section)continue;const explanation=el('details'),summary=el('summary',text('Por que este é um contraexemplo?','Why is this a counterexample?'));explanation.append(summary);const values=conclusion.counterexample;for(const premise of prepared.premises)explanation.append(el('p',snapshot[premise.index].text+' = '+(LPLogic.evaluate(premise.tree,values)?text('V','T'):'F')));explanation.append(el('p','∴ '+snapshot[conclusion.index].text+' = F'));explanation.append(el('p',text('Nesta interpretação, todas as premissas são verdadeiras, mas esta conclusão é falsa. Portanto, as premissas não garantem a conclusão.','In this interpretation, every premise is true but this conclusion is false. Therefore, the premises do not guarantee this conclusion.')));const steps=el('details'),stepsTitle=el('summary',text('Avaliação dos conectivos','Connective evaluation'));steps.append(stepsTitle);for(const formula of [...prepared.premises,prepared.conclusions.find(c=>c.index===conclusion.index)])explainTree(formula.tree,values,steps);explanation.append(steps);section.append(explanation);}
const redundancy=el('details'),summary=el('summary',text('Analisar premissas redundantes','Analyze redundant premises')),output=el('div'),run=action(text('Analisar','Analyze'),async()=>{run.disabled=true;output.textContent=text('Analisando…','Analyzing…');const found=[];for(const premise of prepared.premises){if(revision!==logicRevision||!logicEnabled)return;const remaining=prepared.premises.filter(p=>p.index!==premise.index).map(p=>({...snapshot[p.index]}));remaining.push({text:snapshot[premise.index].text,role:'conclusion'});const data=await LPLogic.validate(remaining,{cancelled:()=>revision!==logicRevision||!logicEnabled,yieldTask:()=>new Promise(r=>setTimeout(r,0))});if(data.status==='valid')found.push(premise);}if(revision!==logicRevision||!logicEnabled)return;output.replaceChildren();output.append(el('p',text('Uma premissa é redundante aqui quando decorre das outras. Cada resultado considera a retirada de uma única premissa; não retire todas simultaneamente.','A premise is redundant here when it follows from the others. Each result considers removing only one premise; do not remove all of them together.')));if(!found.length)output.append(el('p',text('Nenhuma premissa redundante encontrada.','No redundant premises found.')));for(const premise of found)output.append(el('p',text('Linha ','Line ')+(premise.index+1)+': '+snapshot[premise.index].text));run.disabled=false;});redundancy.append(summary,run,output);logicPanel.append(redundancy);
};
const proposition=bar.querySelector('button');proposition.classList.add('hy-proposition-descriptions','hy-icon-button');proposition.setAttribute('aria-label',text('Descrição das proposições','Proposition descriptions'));proposition.title=text('Descrição das proposições','Proposition descriptions');proposition.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4Z M8 8h8 M8 12h8 M8 16h4"/></svg>';root.querySelector('.hy-editor .hy-section-head').append(proposition);logicPanel.append(bar);
const validationWithTools=updateLogicValidation;updateLogicValidation=async function(){const pending=validationWithTools(),revision=logicRevision;await pending;if(logicEnabled&&revision===logicRevision)logicPanel.append(bar);};
let lastLanguage=document.documentElement.lang;new MutationObserver(()=>{if(lastLanguage===document.documentElement.lang)return;lastLanguage=document.documentElement.lang;bar.querySelectorAll('button').forEach(b=>b.textContent=text('Comparar fórmulas','Compare formulas'));proposition.setAttribute('aria-label',text('Descrição das proposições','Proposition descriptions'));proposition.title=text('Descrição das proposições','Proposition descriptions');refreshDescriptions();saveArguments();}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
saveArguments();refreshDescriptions();
})();
</script>

</style>

</style>
