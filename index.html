/* Use the window dimensions and keep argument actions inside its collapse. */
body{padding:0;min-height:100dvh}
#lp-hybrid{width:100%;max-width:none;min-height:100dvh;margin:0;border:0;border-radius:0;display:flex;flex-direction:column}
#lp-hybrid .hy-head{flex-shrink:0}
#lp-hybrid .hy-layout{flex:1;min-height:0}
#lp-hybrid .hy-side{border-radius:0}
#lp-hybrid .hy-argument-panel .hy-tools{border-top:0;padding-top:0;margin-bottom:16px}
/* Leave room for focus outlines inside the animated clipping container. */
#lp-hybrid .hy-rows{padding:4px}
#lp-hybrid .hy-layout{grid-template-columns:320px minmax(0,1fr)}
#lp-hybrid .hy-side{padding:24px 20px}
#lp-hybrid .hy-side h3{font-size:14px}
#lp-hybrid .hy-library summary{font-size:14px;min-height:44px;padding:10px}
#lp-hybrid .hy-library .hy-symbols{gap:8px;padding-top:14px;padding-bottom:8px}
#lp-hybrid .hy-library .hy-symbol{min-width:52px;min-height:52px;padding:10px;font-size:26px;border:1px solid var(--edge);background:var(--paper);border-radius:9px}
#lp-hybrid .hy-library .hy-symbol:hover{background:var(--soft);border-color:var(--blue)}
@media(max-width:900px){#lp-hybrid .hy-layout{grid-template-columns:280px minmax(0,1fr)}#lp-hybrid .hy-side{padding:20px 16px}}
@media(max-width:600px){#lp-hybrid .hy-layout{grid-template-columns:minmax(0,1fr)}#lp-hybrid .hy-side{border-bottom:1px solid var(--edge)}}

#lp-hybrid{--library-scale:1;--writing-scale:1;--sidebar-base:238px}
#lp-hybrid .hy-layout{grid-template-columns:calc(var(--sidebar-base) * var(--library-scale)) minmax(0,1fr)}
#lp-hybrid .hy-side{padding:22px 16px}
#lp-hybrid .hy-side-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
#lp-hybrid .hy-side-heading h3{margin:0;font-size:calc(14px * var(--library-scale))}
#lp-hybrid .hy-library summary{font-size:calc(14px * var(--library-scale))}
#lp-hybrid .hy-library .hy-symbol{min-width:calc(52px * var(--library-scale));min-height:calc(52px * var(--library-scale));font-size:calc(26px * var(--library-scale))}
#lp-hybrid .hy-editor .hy-size-button{margin-left:auto}
#lp-hybrid .hy-row{grid-template-columns:22px minmax(0,1fr) calc(100px * var(--writing-scale))}
#lp-hybrid .hy-row input{font-size:calc(18px * var(--writing-scale));padding:calc(11px * var(--writing-scale)) calc(12px * var(--writing-scale))}
#lp-hybrid .hy-rows{gap:calc(12px * var(--writing-scale))}
#lp-hybrid .hy-role{font-size:calc(12px * var(--writing-scale))}
#lp-hybrid .hy-work h3{font-size:calc(13px * var(--writing-scale))}
#lp-hybrid .hy-preview{font-size:calc(20px * var(--writing-scale))}
#lp-hybrid .hy-argument-panel .hy-section-head{flex-wrap:wrap}
#lp-hybrid .hy-argument-panel .hy-tools{flex:1;margin:0;padding:0;gap:12px}
#lp-hybrid .hy-tools[hidden]{display:none!important}
.hy-size-popover{color:light-dark(#26292e,#e9ebef);background:light-dark(#fff,#202124);border:1px solid light-dark(#dfe3e9,#34363b);border-radius:10px;padding:16px;font:14px system-ui;box-shadow:0 8px 28px #0002;inset:72px auto auto 20px;max-width:calc(100vw - 40px)}
#size-writing{inset:110px 28px auto auto}
.hy-size-popover label{display:block;margin-bottom:12px}
.hy-size-range{display:flex;align-items:center;gap:10px}

<script>

const rowsContainer=document.querySelector('#rows'),preview=document.querySelector('#preview'),status=document.querySelector('#status');

let active=null,numbered=true;
let drag=null;
const rowElements=new WeakMap();
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function animateOrder(){
const positions=new Map([...rowsContainer.children].map(line=>[line,line.getBoundingClientRect().top]));

}

}}

while(destination>0){const line=rowElements.get(rows[destination-1]);if(top>=parentTop+line.offsetTop+line.offsetHeight*(1-threshold))break;destination--;}

}

const spacing=new WeakMap();

let argumentWorkspace={documents:[{id:'argument-1',name:'Argumento 1',rows,numbered}],activeId:'argument-1',nextNumber:2};

function captureArgumentSelection(){const doc=argumentWorkspace.documents.find(doc=>doc.id===argumentWorkspace.activeId);const index=[...rowsContainer.querySelectorAll('input')].indexOf(active);if(index>=0)doc.selection={index,start:active.selectionStart,end:active.selectionEnd};}

let renameId=null;
function commitArgumentName(id,name){if(typeof name!=='string')return;const doc=argumentWorkspace.documents.find(doc=>doc.id===id);if(!doc)return;doc.customName=name.trim();renumberArguments();drawArgumentTabs();saveArguments();}

function createArgument(){const index=argumentWorkspace.nextNumber++;const doc={id:'argument-'+crypto.randomUUID(),name:'Argumento '+index,rows:[{text:'',role:'premise'},{text:'',role:'premise'},{text:'',role:'conclusion'}],numbered:true};argumentWorkspace.documents.push(doc);showArgument(doc.id,true);document.querySelector('[aria-selected="true"]').scrollIntoView({block:'nearest',inline:'nearest'});}

let argumentTabDrag=null,tabSuppressUntil=0;

function startArgumentTabDrag(event){if(event.button!==0||argumentTabDrag||drag)return;const shell=event.target.closest('.hy-tab-shell');if(!shell)return;const box=shell.getBoundingClientRect();argumentTabDrag={id:shell.dataset.argumentId,shell,pointerId:event.pointerId,pointerType:event.pointerType,startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,offsetX:event.clientX-box.left,offsetY:event.clientY-box.top,width:box.width,height:box.height,active:false,ghost:null,timer:null,frame:null};argumentTabDrag.timer=setTimeout(liftArgumentTab,250);}

function buildRow(row,index){

field.addEventListener('focus',()=>active=field);field.addEventListener('input',event=>automaticSpace(row,field,event));field.addEventListener('compositionend',()=>automaticSpace(row,field,{inputType:'insertText'}));field.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();addLine(index+1);}});
let holdTimer=null,roleHeld=false;
function cancelRoleHold(){clearTimeout(holdTimer);holdTimer=null;}
function startRoleHold(){cancelRoleHold();roleHeld=false;holdTimer=setTimeout(()=>{if(!toggle.isConnected||!rows.includes(row))return;const state=spacing.get(row);if(state){clearTimeout(state.timer);if(state.generated&&row.text.endsWith(' '))row.text=row.text.slice(0,-1);state.generated=false;}row.role='blank';roleHeld=true;updateRole();render();},300);}

function translated(text){const words=text.trim(),english=ui.language==='en';const dict=english?translations:reverseTranslations;let value=dict[words];if(value===undefined){let match;if(english&&(match=words.match(/^Expressão da linha (\d+)$/)))value='Expression on line '+match[1];else if(!english&&(match=words.match(/^Expression on line (\d+)$/)))value='Expressão da linha '+match[1];else if(english&&(match=words.match(/^Linha (\d+): (conclusão|premissa)\. Alternar tipo$/)))value='Line '+match[1]+': '+(match[2]==='conclusão'?'conclusion':'premise')+'. Toggle type';else if(!english&&(match=words.match(/^Line (\d+): (conclusion|premise)\. Toggle type$/)))value='Linha '+match[1]+': '+(match[2]==='conclusion'?'conclusão':'premissa')+'. Alternar tipo';else if(english&&(match=words.match(/^Mover linha (\d+)\. Arraste ou use as setas do teclado\.$/)))value='Move line '+match[1]+'. Drag or use the arrow keys.';else if(!english&&(match=words.match(/^Move line (\d+)\. Drag or use the arrow keys\.$/)))value='Mover linha '+match[1]+'. Arraste ou use as setas do teclado.';}if(value===undefined&&english&&/^Excluir Argumento \d+$/.test(words))value=words.replace('Excluir Argumento','Delete Argument');else if(value===undefined&&!english&&/^Delete Argument \d+$/.test(words))value=words.replace('Delete Argument','Excluir Argumento');if(value===undefined&&english&&/^Argumento \d+$/.test(words))value=words.replace('Argumento','Argument');else if(value===undefined&&!english&&/^Argument \d+$/.test(words))value=words.replace('Argument','Argumento');if(value===undefined&&words.includes(' · ')){const [operation,...rest]=words.split(' · ');if(dict[operation])value=dict[operation]+' · '+rest.join(' · ');}return value===undefined?text:text.replace(words,value);}

function applyLanguage(){const english=ui.language==='en';document.documentElement.lang=english?'en':'pt-BR';document.title=english?'Propositional Logic':'Lógica Proposicional';const flag=root.querySelector('#settings-language');const code=english?'en':'pt';if(flag.dataset.language!==code){flag.dataset.language=code;flag.innerHTML=languageFlags[code];}const flagLabel=english?'Mudar para Português (Brasil)':'Switch to International English',flagTitle=english?'International English':'Português (Brasil)';if(flag.getAttribute('aria-label')!==flagLabel)flag.setAttribute('aria-label',flagLabel);if(flag.title!==flagTitle)flag.title=flagTitle;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walker.nextNode()){const node=walker.currentNode;if(node.parentElement.closest('pre,input,script,style,output,#settings-language,.hy-custom-argument-name'))continue;const value=translated(node.nodeValue);if(value!==node.nodeValue)node.nodeValue=value;}root.querySelectorAll('[aria-label],[title],[data-tooltip]').forEach(element=>{if(element===flag)return;for(const attribute of ['aria-label','title','data-tooltip']){const value=element.getAttribute(attribute);if(value!==null){const next=translated(value);if(next!==value)element.setAttribute(attribute,next);}}});}
